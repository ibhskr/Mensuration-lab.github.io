<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mensuration Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1120; --panel:#101c33; --panel2:#0c1729;
    --grid:rgba(148,178,224,.07); --border:#1c2c48; --border-hi:#2a3f66;
    --ink:#e9eefb; --muted:#8ea0c2; --muted2:#5c6f93; --amber:#f0a63c; --teal:#57d6c2;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px, var(--bg);
    color:var(--ink); font-family:'Space Grotesk',sans-serif; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber); color:#1a1305;}
  header{
    padding:20px clamp(16px,4vw,40px) 16px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  header h1{font-size:22px; font-weight:700; margin:0;}
  header h1 .dot{color:var(--amber);}
  .langbox{display:flex; align-items:center; gap:8px;}
  .langbox label{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted2); text-transform:uppercase; letter-spacing:.4px;}
  select#langSel{background:var(--panel); color:var(--ink); border:1px solid var(--border-hi); border-radius:7px; padding:7px 10px; font-family:'Space Grotesk',sans-serif; font-size:13.5px; cursor:pointer;}
  #status{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--amber); min-height:14px;}
  .tagline{color:var(--muted); font-size:13.5px; padding:10px clamp(16px,4vw,40px) 0; max-width:640px;}
  .layout{display:grid; grid-template-columns:230px 1fr; min-height:calc(100% - 76px);}
  @media (max-width:820px){ .layout{grid-template-columns:1fr;} }
  nav{border-right:1px solid var(--border); padding:20px 10px 40px;}
  @media (max-width:820px){ nav{border-right:none; border-bottom:1px solid var(--border); padding:14px 14px 18px;} }
  .grp-label{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted2); padding:10px 12px 6px; letter-spacing:.5px;}
  .shape-btn{
    display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none;
    color:var(--muted); font-family:'Space Grotesk',sans-serif; font-size:14.5px; padding:9px 12px; border-radius:7px; cursor:pointer;
  }
  .shape-btn:hover{background:var(--panel); color:var(--ink);}
  .shape-btn.active{background:var(--panel2); color:var(--amber); box-shadow:inset 2px 0 0 var(--amber);}
  .shape-btn .glyph{width:18px; text-align:center; color:var(--muted2); font-family:'IBM Plex Mono',monospace; font-size:12px;}
  .shape-btn.active .glyph{color:var(--amber);}
  @media (max-width:820px){ nav .groups{display:flex; gap:6px; overflow-x:auto;} .grp-label{display:none;} .shape-btn{white-space:nowrap; width:auto;} }
  main{padding:clamp(18px,3.5vw,40px); max-width:900px;}
  .shape-head{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
  .shape-head h2{font-size:clamp(24px,4vw,32px); margin:0;}
  .cat-pill{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--teal); border:1px solid var(--border-hi); padding:4px 10px; border-radius:20px; text-transform:uppercase; letter-spacing:.5px;}

  .sec{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:20px 22px; margin-bottom:16px;}
  .sec h3{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--muted2); text-transform:uppercase; letter-spacing:.7px; margin:0 0 14px; display:flex; align-items:center; gap:8px;}
  .sec h3 .n{color:var(--amber);}

  #svgWrap{background:var(--panel2); border:1px dashed var(--border-hi); border-radius:8px; display:flex; align-items:center; justify-content:center; padding:10px; min-height:230px;}
  #svgWrap svg{width:100%; max-width:340px; height:auto;}

  .formula-line{font-family:'IBM Plex Mono',monospace; font-size:20px; color:var(--teal); margin:6px 0; padding-bottom:8px; border-bottom:1px solid var(--border);}
  .formula-line:last-child{border-bottom:none;}

  .fgroup{margin-bottom:18px;}
  .fgroup:last-child{margin-bottom:0;}
  .fgroup .flabel{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--muted2); margin-bottom:4px;}
  .fgroup .fexpr{font-family:'IBM Plex Mono',monospace; font-size:19px; color:var(--teal); margin-bottom:10px;}
  .chunk{display:grid; grid-template-columns:64px 1fr; gap:12px; padding:8px 0; border-top:1px solid var(--border);}
  .chunk .part{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--amber); font-weight:600; padding-top:2px;}
  .chunk .why{color:var(--muted); font-size:14px; line-height:1.65;}
  @media (max-width:520px){ .chunk{grid-template-columns:1fr;} .chunk .part{padding-top:0;} }

  .example-block{color:var(--muted); font-size:14.5px; line-height:1.7; font-family:'IBM Plex Mono',monospace; background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:14px 16px;}

  footer{padding:20px clamp(16px,4vw,40px) 34px; color:var(--muted2); font-size:12.5px; font-family:'IBM Plex Mono',monospace;}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<header>
  <h1>Mensuration<span class="dot">.</span>Lab</h1>
  <div class="langbox">
    <label for="langSel" id="langLabel">Language</label>
    <select id="langSel"></select>
  </div>
</header>
<div class="tagline" id="hTag">Pick a shape, then work through exactly how its formula is built, piece by piece.</div>
<div id="status" style="padding:6px clamp(16px,4vw,40px) 0;"></div>

<div class="layout">
  <nav>
    <div class="groups">
      <div class="grp-label" id="grp2dLbl">2D Shapes</div>
      <div id="grp2d"></div>
      <div class="grp-label" id="grp3dLbl">3D Shapes</div>
      <div id="grp3d"></div>
    </div>
  </nav>
  <main>
    <div class="shape-head"><h2 id="shapeName"></h2><span class="cat-pill" id="shapeCat"></span></div>

    <div class="sec"><h3><span class="n">1</span> <span id="secDiagram">Diagram</span></h3><div id="svgWrap"></div></div>
    <div class="sec"><h3><span class="n">2</span> <span id="secFormula">Formula</span></h3><div id="formulaBox"></div></div>
    <div class="sec"><h3><span class="n">3</span> <span id="secExplain">How the formula works</span></h3><div id="explainBox"></div></div>
    <div class="sec"><h3><span class="n">4</span> <span id="secExample">Example</span></h3><div class="example-block" id="exampleBox"></div></div>
  </main>
</div>
<footer id="footerTxt">Built for quick, hands-on intuition &mdash; not a substitute for your textbook's proofs.</footer>

<script>
const CX=160, CY=170;
function ellipse(cx,cy,rx,ry,extra=''){return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" ${extra}/>`;}
function poly(pts,extra=''){return `<polygon points="${pts}" ${extra}/>`;}
function dash(x1,y1,x2,y2){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--amber)" stroke-width="1.2" stroke-dasharray="3,3" opacity=".8"/>`;}
function tagT(x,y,t){return `<text x="${x}" y="${y}" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="600" fill="var(--amber)" text-anchor="middle">${t}</text>`;}
const STROKE='stroke="var(--teal)" stroke-width="2" fill="rgba(87,214,194,.12)"';

const EN = {
  chrome:{ tag:"Pick a shape, then work through exactly how its formula is built, piece by piece.",
    grp2d:'2D Shapes', grp3d:'3D Shapes', secDiagram:'Diagram', secFormula:'Formula',
    secExplain:'How the formula works', secExample:'Example', langLabel:'Language',
    footer:"Built for quick, hands-on intuition \u2014 not a substitute for your textbook's proofs.",
    cat2d:'2D SHAPE', cat3d:'3D SHAPE' },
  stats:{area:'Area',perimeter:'Perimeter',circumference:'Circumference',volume:'Volume',surfaceArea:'Surface area'},
  shapes:{
    square:{ name:'Square',
      formulas:[
        {code:'area', chunks:[
          {why:"This is the length of one side. A square has all four sides equal, so one measurement, a, is all we need."},
          {why:"Area is a flat (2-dimensional) measurement \u2014 it covers a surface made of length AND width. Since both are equal to a, we multiply a by a."},
          {why:"a \u00D7 a is written a\u00B2 (\u201Ca squared\u201D). The small 2 just means \u201Cmultiplied by itself twice\u201D \u2014 shorthand for the two dimensions area needs."}
        ]},
        {code:'perimeter', chunks:[
          {why:"Perimeter is the distance walked all the way around the outside \u2014 just add up all four sides."},
          {why:"Since all four sides equal a, adding a four times is the same as 4\u00D7a. No squaring here, because perimeter is only a 1-dimensional length, not a flat area."}
        ]}
      ],
      example:"With a = 6: Area = 6\u00B2 = 36 sq. units. Perimeter = 4 \u00D7 6 = 24 units."},
    rectangle:{ name:'Rectangle',
      formulas:[
        {code:'area', chunks:[
          {why:"l is the longer side (length), w is the shorter side (width)."},
          {why:"Area needs two dimensions multiplied together \u2014 how many unit squares fit along the length, repeated for every row of the width. l \u00D7 w gives exactly that count."}
        ]},
        {code:'perimeter', chunks:[
          {why:"One length plus one width, l + w, covers half the distance around the rectangle."},
          {why:"A rectangle has two lengths and two widths, so doubling that half-distance, 2(l+w), gives the full way around."}
        ]}
      ],
      example:"With l = 8, w = 5: Area = 8 \u00D7 5 = 40 sq. units. Perimeter = 2 \u00D7 (8+5) = 26 units."},
    circle:{ name:'Circle',
      formulas:[
        {code:'area', chunks:[
          {why:"Just like a square, area is 2-dimensional, so we need two lengths multiplied. A circle has no straight side, but its radius r plays that role."},
          {why:"\u03C0 (pi) \u2248 3.14159 is a fixed number found in every circle \u2014 it's the ratio of a circle's circumference to its diameter, and that ratio never changes no matter the size. It works as the conversion factor between a straight length (r) and the curved space it encloses."},
          {why:"Multiplying r\u00B2 by \u03C0 scales the \u201Csquare\u201D area up to match the circle's round shape \u2014 the result is about 78.5% of the square that exactly contains the circle (a square with side 2r)."}
        ]},
        {code:'circumference', chunks:[
          {why:"2r is the diameter \u2014 the straight-line distance across the circle through its center."},
          {why:"By definition, \u03C0 = circumference \u00F7 diameter. So multiplying diameter by \u03C0 gives the circumference directly: 2\u03C0r."}
        ]}
      ],
      example:"With r = 7: Area = \u03C0 \u00D7 7\u00B2 \u2248 153.94 sq. units. Circumference = 2\u03C0 \u00D7 7 \u2248 43.98 units."},
    triangle:{ name:'Triangle',
      formulas:[
        {code:'area', chunks:[
          {why:"b \u00D7 h is the area of the rectangle (or parallelogram) that exactly surrounds the triangle, sharing the same base b and height h."},
          {why:"Any triangle is always exactly half of that surrounding parallelogram \u2014 two identical triangles, one flipped over, tile perfectly into a parallelogram of area b\u00D7h. That's why we divide by 2."}
        ]}
      ],
      example:"With b = 10, h = 6: Area = \u00BD \u00D7 10 \u00D7 6 = 30 sq. units."},
    cube:{ name:'Cube',
      formulas:[
        {code:'volume', chunks:[
          {why:"First, the area of one square face: a \u00D7 a = a\u00B2 (flat, 2 dimensions)."},
          {why:"Volume is 3-dimensional \u2014 it fills length, width AND height. So we multiply that flat face area by the third dimension, also a: a\u00B2 \u00D7 a."},
          {why:"a\u00D7a\u00D7a is written a\u00B3 (\u201Ca cubed\u201D). The small 3 shows three dimensions were multiplied \u2014 the key difference between a squared (flat) quantity and a cubed (solid) one."}
        ]},
        {code:'surfaceArea', chunks:[
          {why:"Each face of the cube is a flat square, so each has area a \u00D7 a = a\u00B2."},
          {why:"A cube has exactly 6 identical faces (top, bottom, four sides), so we multiply one face's area by 6."}
        ]}
      ],
      example:"With a = 4: Volume = 4\u00B3 = 64 cubic units. Surface area = 6 \u00D7 4\u00B2 = 96 sq. units."},
    cylinder:{ name:'Cylinder',
      formulas:[
        {code:'volume', chunks:[
          {why:"\u03C0r\u00B2 is the area of the circular base \u2014 the same formula as a flat circle."},
          {why:"To turn that flat base into a solid, stack it upward through the height h \u2014 like piling up h very thin coin-shaped discs, each with area \u03C0r\u00B2. That's why we multiply by h, not square or cube it."}
        ]},
        {code:'surfaceArea', chunks:[
          {why:"A cylinder has two flat circular ends (top and bottom), each with area \u03C0r\u00B2 \u2014 doubled to 2\u03C0r\u00B2 because there are two of them."},
          {why:"Cut the curved side and unroll it flat: it becomes a rectangle whose width is the circle's circumference (2\u03C0r) and whose height is h. So its area is 2\u03C0r \u00D7 h."},
          {why:"Adding the two end-caps (2\u03C0r\u00B2) and the unrolled side (2\u03C0rh), then factoring out 2\u03C0r, gives the compact form 2\u03C0r(r + h)."}
        ]}
      ],
      example:"With r = 3, h = 10: Volume = \u03C0 \u00D7 3\u00B2 \u00D7 10 \u2248 282.74 cubic units. Surface area = 2\u03C0 \u00D7 3 \u00D7 (3+10) \u2248 245.04 sq. units."},
    sphere:{ name:'Sphere',
      formulas:[
        {code:'volume', chunks:[
          {why:"It's r\u00B3, not r\u00B2 \u2014 that's the key point. Volume fills 3D space in every direction, and a sphere is perfectly symmetric, so all three dimensions equal the radius r. Multiplying r \u00D7 r \u00D7 r accounts for all three. r\u00B2 alone would only measure a flat circular slice, not the whole solid ball."},
          {why:"Every cross-section through a sphere's center is a circle, so \u03C0 \u2014 the constant that governs circles \u2014 naturally shows up whenever curvature like this is involved."},
          {why:"This fraction comes from comparing the sphere to the cylinder that exactly contains it (same radius r, height 2r, just touching top and bottom). Archimedes proved the sphere's volume is always exactly two-thirds of that cylinder's volume. The cylinder's volume is \u03C0r\u00B2\u00D72r = 2\u03C0r\u00B3. Two-thirds of that: (2/3)\u00D72\u03C0r\u00B3 = 4/3\u00D7\u03C0r\u00B3 \u2014 and that is exactly where the 4/3 comes from."}
        ]},
        {code:'surfaceArea', chunks:[
          {why:"Like any curved area, we start from a squared length \u2014 here the radius \u2014 as the basic unit of area."},
          {why:"This is a genuinely surprising, provable fact: a sphere's entire curved surface has exactly the same total area as 4 flat circles of the same radius r laid side by side. Archimedes proved this too, using the same sphere-in-a-cylinder idea."}
        ]}
      ],
      example:"With r = 6: Volume = 4\u2044\u2083 \u00D7 \u03C0 \u00D7 6\u00B3 \u2248 904.78 cubic units. Surface area = 4\u03C0 \u00D7 6\u00B2 \u2248 452.39 sq. units."},
    cone:{ name:'Cone',
      formulas:[
        {code:'volume', chunks:[
          {why:"\u03C0r\u00B2h is the volume of the cylinder with the same circular base (radius r) and the same height h as the cone."},
          {why:"A cone always holds exactly one-third the volume of that surrounding cylinder. Fill a paper cone with water and pour it into a cylinder of the same base and height \u2014 it takes exactly 3 pours to fill it. This 1/3 comes from the cone tapering evenly to a point: adding up all its shrinking circular slices from base to tip works out mathematically to exactly one-third of the full cylinder."}
        ]},
        {code:'surfaceArea', chunks:[
          {why:"\u03C0r\u00B2 is the flat circular base at the bottom of the cone."},
          {why:"l is the slant height \u2014 the length along the cone's sloped side from the base edge up to the apex. Since r, h and l form a right triangle inside the cone, the Pythagorean theorem gives l = \u221A(r\u00B2+h\u00B2)."},
          {why:"Cut the cone's curved surface and unroll it flat \u2014 it forms a sector (a pie-slice) of a circle with radius l, and that sector's area works out to \u03C0 \u00D7 r \u00D7 l."},
          {why:"Adding the base (\u03C0r\u00B2) and the curved surface (\u03C0rl), then factoring out \u03C0r, gives the combined formula \u03C0r(r + l)."}
        ]}
      ],
      example:"With r = 3, h = 8: slant l = \u221A(3\u00B2+8\u00B2) \u2248 8.54. Volume = \u2153 \u00D7 \u03C0 \u00D7 3\u00B2 \u00D7 8 \u2248 75.40 cubic units. Surface area \u2248 108.80 sq. units."}
  }
};

// static structural data (symbols, expressions, drawings) -- never translated
const SHAPES = [
  { id:'square', cat:'2d', glyph:'\u25A1',
    formulas:[{code:'area',expr:'a\u00B2',parts:['a','a \u00D7 a','a\u00B2']},{code:'perimeter',expr:'4a',parts:['a + a + a + a','4a']}],
    draw:()=>{const s=120,x=CX-s/2,y=CY-s/2; return `<rect x="${x}" y="${y}" width="${s}" height="${s}" ${STROKE}/>${tagT(CX,y-10,'a')}${dash(x,y-4,x+s,y-4)}`;}
  },
  { id:'rectangle', cat:'2d', glyph:'\u25AC',
    formulas:[{code:'area',expr:'l \u00D7 w',parts:['l, w','l \u00D7 w']},{code:'perimeter',expr:'2(l + w)',parts:['l + w','2(l + w)']}],
    draw:()=>{const w=150,h=85,x=CX-w/2,y=CY-h/2; return `<rect x="${x}" y="${y}" width="${w}" height="${h}" ${STROKE}/>${tagT(CX,y-10,'l')}${dash(x,y-4,x+w,y-4)}${tagT(x-16,CY+4,'w')}${dash(x-8,y,x-8,y+h)}`;}
  },
  { id:'circle', cat:'2d', glyph:'\u25CB',
    formulas:[{code:'area',expr:'\u03C0r\u00B2',parts:['r\u00B2','\u03C0','\u03C0r\u00B2']},{code:'circumference',expr:'2\u03C0r',parts:['2r','\u03C0','2\u03C0r']}],
    draw:()=>{const r=90; return ellipse(CX,CY,r,r,STROKE)+`<line x1="${CX}" y1="${CY}" x2="${CX+r}" y2="${CY}" stroke="var(--amber)" stroke-width="1.5"/><circle cx="${CX}" cy="${CY}" r="2.5" fill="var(--amber)"/>`+tagT(CX+r*0.5,CY-8,'r');}
  },
  { id:'triangle', cat:'2d', glyph:'\u25B3',
    formulas:[{code:'area',expr:'\u00BD \u00D7 b \u00D7 h',parts:['b \u00D7 h','\u00BD']}],
    draw:()=>{const b=140,h=105,x0=CX-b/2,y0=CY+h/2,apex=x0+b*0.35;
      return poly(`${x0},${y0} ${x0+b},${y0} ${apex},${y0-h}`,STROKE)+dash(apex,y0,apex,y0-h)+tagT(apex+14,y0-h/2,'h')+tagT(CX,y0+18,'b');}
  },
  { id:'cube', cat:'3d', glyph:'\u25A3',
    formulas:[{code:'volume',expr:'a\u00B3',parts:['a \u00D7 a','\u00D7 a','a\u00B3']},{code:'surfaceArea',expr:'6a\u00B2',parts:['a\u00B2','6']}],
    draw:()=>cuboidSVG(60,60,60)
  },
  { id:'cylinder', cat:'3d', glyph:'\u2B58',
    formulas:[{code:'volume',expr:'\u03C0r\u00B2h',parts:['\u03C0r\u00B2','\u00D7 h']},{code:'surfaceArea',expr:'2\u03C0r(r + h)',parts:['2\u03C0r\u00B2','2\u03C0rh','2\u03C0r(r + h)']}],
    draw:()=>cylinderSVG(50,100)
  },
  { id:'sphere', cat:'3d', glyph:'\u25CF',
    formulas:[{code:'volume',expr:'\u2074\u2044\u2083\u03C0r\u00B3',parts:['r\u00B3','\u03C0','4\u2044\u2083']},{code:'surfaceArea',expr:'4\u03C0r\u00B2',parts:['r\u00B2','4']}],
    draw:()=>sphereSVG(85)
  },
  { id:'cone', cat:'3d', glyph:'\u25B2',
    formulas:[{code:'volume',expr:'\u2153\u03C0r\u00B2h',parts:['\u03C0r\u00B2h','\u2153']},{code:'surfaceArea',expr:'\u03C0r(r + l)',parts:['\u03C0r\u00B2','l = \u221A(r\u00B2+h\u00B2)','\u03C0rl','\u03C0r(r + l)']}],
    draw:()=>coneSVG(50,100)
  },
];

function cuboidSVG(l,h,w){
  const sc=1.05, iso=(x,y,z)=>[CX+(x-z)*0.87*sc, CY+((x+z)*0.5*sc)-y*sc], p=(x,y,z)=>iso(x,y,z).join(',');
  const top=`${p(0,h,0)} ${p(l,h,0)} ${p(l,h,w)} ${p(0,h,w)}`, front=`${p(0,0,0)} ${p(l,0,0)} ${p(l,h,0)} ${p(0,h,0)}`, right=`${p(l,0,0)} ${p(l,0,w)} ${p(l,h,w)} ${p(l,h,0)}`;
  const [fx1,fy1]=iso(0,0,0), [fx2,fy2]=iso(l,0,0);
  return poly(top,'fill="rgba(87,214,194,.28)" stroke="var(--teal)" stroke-width="1.6"')+poly(front,'fill="rgba(87,214,194,.14)" stroke="var(--teal)" stroke-width="1.6"')+poly(right,'fill="rgba(87,214,194,.06)" stroke="var(--teal)" stroke-width="1.6"')+tagT((fx1+fx2)/2,(fy1+fy2)/2+16,'a');
}
function cylinderSVG(r,h){
  const rx=r*1.4,ry=r*0.45,topY=CY-h/2,botY=CY+h/2;
  return `<path d="M${CX-rx},${topY} A${rx},${ry} 0 0 0 ${CX+rx},${topY} L${CX+rx},${botY} A${rx},${ry} 0 0 1 ${CX-rx},${botY} Z" ${STROKE}/>`+ellipse(CX,topY,rx,ry,STROKE)+`<line x1="${CX}" y1="${topY}" x2="${CX+rx}" y2="${topY}" stroke="var(--amber)" stroke-width="1.5"/>`+tagT(CX+rx*0.5,topY-8,'r')+dash(CX-rx-10,topY,CX-rx-10,botY)+tagT(CX-rx-22,CY+4,'h');
}
function coneSVG(r,h){
  const rx=r*1.4,ry=r*0.45,baseY=CY+h*0.35,apexY=baseY-h;
  return `<path d="M${CX-rx},${baseY} A${rx},${ry} 0 0 0 ${CX+rx},${baseY} L${CX},${apexY} Z" ${STROKE}/>`+ellipse(CX,baseY,rx,ry,STROKE)+`<line x1="${CX}" y1="${baseY}" x2="${CX+rx}" y2="${baseY}" stroke="var(--amber)" stroke-width="1.5"/>`+tagT(CX+rx*0.5,baseY-8,'r')+dash(CX-rx-10,apexY,CX-rx-10,baseY)+tagT(CX-rx-22,(apexY+baseY)/2,'h');
}
function sphereSVG(r){
  return `<defs><radialGradient id="sg" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="rgba(87,214,194,.55)"/><stop offset="100%" stop-color="rgba(87,214,194,.05)"/></radialGradient></defs>`+
    ellipse(CX,CY,r,r,'fill="url(#sg)" stroke="var(--teal)" stroke-width="2"')+ellipse(CX,CY,r,r*0.32,'fill="none" stroke="var(--teal)" stroke-width="1" stroke-dasharray="3,3" opacity=".5"')+
    `<line x1="${CX}" y1="${CY}" x2="${CX+r}" y2="${CY}" stroke="var(--amber)" stroke-width="1.5"/><circle cx="${CX}" cy="${CY}" r="2.5" fill="var(--amber)"/>`+tagT(CX+r*0.5,CY-8,'r');
}

const LANGS = [
  {code:'en',name:'English'},{code:'hi',name:'Hindi'},{code:'bn',name:'Bengali'},{code:'ta',name:'Tamil'},
  {code:'te',name:'Telugu'},{code:'es',name:'Spanish'},{code:'fr',name:'French'},{code:'de',name:'German'},
  {code:'ar',name:'Arabic'},{code:'zh',name:'Chinese (Simplified)'},{code:'ja',name:'Japanese'},{code:'pt',name:'Portuguese'}
];
let sampleFn=null, cache={en:EN}, curLang='en', curId='square';
(async()=>{ try{ sampleFn = await claude.use('sample'); }catch(e){ sampleFn=null; } })();

function buildLangSelect(){
  const sel=document.getElementById('langSel');
  sel.innerHTML = LANGS.map(l=>`<option value="${l.code}">${l.name}</option>`).join('');
  sel.onchange = e=>setLanguage(e.target.value);
}
async function setLanguage(code){
  const status=document.getElementById('status');
  if(cache[code]){ curLang=code; applyDict(cache[code]); return; }
  if(!sampleFn){
    status.textContent='Live translation is not available in this view \u2014 showing English.';
    setTimeout(()=>status.textContent='',3500);
    document.getElementById('langSel').value='en'; curLang='en'; applyDict(EN); return;
  }
  status.textContent='Translating\u2026';
  try{
    const name = LANGS.find(l=>l.code===code).name;
    const prompt = `Translate every string value in this JSON object into ${name}. Keep the JSON keys and overall structure exactly the same. Do NOT translate mathematical symbols, numbers, or single-letter variable names such as a, r, h, l, w, b \u2014 leave those unchanged. Return ONLY valid JSON, no markdown fences, matching this exact shape:\n\n${JSON.stringify(EN)}`;
    const translated = await sampleFn.json(prompt, {modelTier:'default'});
    cache[code]=translated; curLang=code; applyDict(translated);
  }catch(err){
    status.textContent='Translation failed \u2014 showing English.'; setTimeout(()=>status.textContent='',3500);
    document.getElementById('langSel').value='en'; curLang='en'; applyDict(EN);
  }
  status.textContent='';
}
function applyDict(dict){
  document.getElementById('hTag').textContent=dict.chrome.tag;
  document.getElementById('grp2dLbl').textContent=dict.chrome.grp2d;
  document.getElementById('grp3dLbl').textContent=dict.chrome.grp3d;
  document.getElementById('secDiagram').textContent=dict.chrome.secDiagram;
  document.getElementById('secFormula').textContent=dict.chrome.secFormula;
  document.getElementById('secExplain').textContent=dict.chrome.secExplain;
  document.getElementById('secExample').textContent=dict.chrome.secExample;
  document.getElementById('footerTxt').textContent=dict.chrome.footer;
  document.getElementById('langLabel').textContent=dict.chrome.langLabel;
  buildNav(dict);
  selectShape(curId, dict);
}
function buildNav(dict){
  const g2=document.getElementById('grp2d'), g3=document.getElementById('grp3d');
  g2.innerHTML=''; g3.innerHTML='';
  SHAPES.forEach(s=>{
    const b=document.createElement('button');
    b.className='shape-btn'+(s.id===curId?' active':''); b.id='nav-'+s.id;
    b.innerHTML=`<span class="glyph">${s.glyph}</span>${dict.shapes[s.id].name}`;
    b.onclick=()=>selectShape(s.id, cache[curLang]||EN);
    (s.cat==='2d'?g2:g3).appendChild(b);
  });
}
function selectShape(id, dict){
  curId=id;
  const s=SHAPES.find(x=>x.id===id), sd=dict.shapes[id];
  document.querySelectorAll('.shape-btn').forEach(b=>b.classList.remove('active'));
  const nb=document.getElementById('nav-'+id); if(nb) nb.classList.add('active');
  document.getElementById('shapeName').textContent=sd.name;
  document.getElementById('shapeCat').textContent=s.cat==='2d'?dict.chrome.cat2d:dict.chrome.cat3d;
  document.getElementById('svgWrap').innerHTML = `<svg viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg">${s.draw()}</svg>`;

  document.getElementById('formulaBox').innerHTML = s.formulas.map(f=>
    `<div class="formula-line">${dict.stats[f.code]} = ${f.expr}</div>`).join('');

  document.getElementById('explainBox').innerHTML = s.formulas.map((f,i)=>{
    const chunks = sd.formulas[i].chunks.map((c,j)=>
      `<div class="chunk"><div class="part">${f.parts[j]}</div><div class="why">${c.why}</div></div>`).join('');
    return `<div class="fgroup"><div class="flabel">${dict.stats[f.code]}</div><div class="fexpr">${f.expr}</div>${chunks}</div>`;
  }).join('');

  document.getElementById('exampleBox').textContent = sd.example;
}

buildLangSelect();
applyDict(EN);
</script>
</body>
